  <style>
  body {
    font-family: 'Outfit', -apple-system, sans-serif;
  }
  .serif-font {
    font-family: 'Poppins', -apple-system, sans-serif;
    font-weight: 700;
    letter-spacing: -0.5px;
  }
  
  /* Fundo com imagem */
  .hero-bg {
    background-image: url('https://i.imgur.com/cIMJf5j.jpg');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    background-color: #1e3a5f;
    position: relative;
    overflow: hidden;
  }
  
  /* Blueberries decorativos */
  .berry {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #6b5b95, #2d1b4e);
    box-shadow: 
      inset -3px -3px 8px rgba(0,0,0,0.4),
      inset 2px 2px 4px rgba(255,255,255,0.15),
      0 4px 12px rgba(0,0,0,0.3);
  }
  
  .berry::after {
    content: '';
    position: absolute;
    top: 15%;
    left: 25%;
    width: 25%;
    height: 25%;
    background: radial-gradient(circle, rgba(255,255,255,0.4), transparent);
    border-radius: 50%;
  }
  
  /* Folhas */
  .leaf {
    position: absolute;
    background: linear-gradient(135deg, #22c55e, #15803d);
    clip-path: ellipse(50% 25% at 50% 50%);
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    opacity: 0.85;
  }
  
  /* Partículas de luz */
  .sparkle {
    position: absolute;
    width: 4px;
    height: 4px;
    background: white;
    border-radius: 50%;
    opacity: 0.6;
    animation: twinkle 3s ease-in-out infinite;
  }
  
  @keyframes twinkle {
    0%, 100% { opacity: 0.2; transform: scale(1); }
    50% { opacity: 0.8; transform: scale(1.5); }
  }
  
  /* Animação do modal */
  @keyframes slideUp {
    from {
      opacity: 0;
      transform: translateY(40px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
  
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  
  .modal-animate {
    animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }
  
  .backdrop-animate {
    animation: fadeIn 0.3s ease-out forwards;
  }
  
  /* Botão com efeito */
  .btn-primary {
    background: linear-gradient(135deg, #7c3aed 0%, #4f46e5 100%);
    box-shadow: 
      0 10px 25px -5px rgba(124, 58, 237, 0.5),
      0 0 0 1px rgba(255,255,255,0.1) inset;
    transition: all 0.2s ease;
  }
  
  .btn-primary:hover, .btn-primary:active {
    transform: translateY(-1px);
    box-shadow: 
      0 15px 30px -5px rgba(124, 58, 237, 0.6),
      0 0 0 1px rgba(255,255,255,0.2) inset;
  }
  
  .btn-secondary {
    background: white;
    color: #4f46e5;
    border: 1.5px solid #e0e7ff;
    transition: all 0.2s ease;
  }
  
  .btn-secondary:hover, .btn-secondary:active {
    background: #f5f3ff;
    border-color: #c7d2fe;
  }
  
  /* Brand mark */
  .brand-pill {
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.25);
  }
  
  .cookie-icon-wrap {
    background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
    box-shadow: 0 8px 20px -4px rgba(251, 191, 36, 0.4);
  }
  
  /* Scroll container */
  .page-wrapper {
    width: 100%;
    height: 100%;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  
  /* Pulse suave no ícone */
  @keyframes gentle-pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }
  
  .icon-pulse {
    animation: gentle-pulse 2.5s ease-in-out infinite;
  }
</style>
