<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oferta Especial</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Iframe com a página de fundo */
    #background-frame {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      z-index: 1;
    }

    /* Overlay escuro semi-transparente para dar foco ao modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 20px;
    }

    /* Caixa do Modal */
    .modal-card {
      position: relative;
      background: #ffffff;
      color: #1a1a1a;
      width: 100%;
      max-width: 440px;
      padding: 36px 28px 28px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
      animation: popIn 0.3s ease-out;
    }

    @keyframes popIn {
      from {
        opacity: 0;
        transform: scale(0.92);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* Botão de Fechar ("X") */
    .close-btn {
      position: absolute;
      top: 14px;
      right: 16px;
      background: none;
      border: none;
      font-size: 24px;
      font-weight: 600;
      color: #888888;
      cursor: pointer;
      line-height: 1;
      transition: color 0.2s ease;
    }

    .close-btn:hover {
      color: #111111;
    }

    /* Tag de destaque */
    .badge {
      display: inline-block;
      background: #eef2ff;
      color: #4f46e5;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 6px 12px;
      border-radius: 999px;
      margin-bottom: 16px;
    }

    .modal-title {
      font-size: 22px;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 12px;
      color: #111827;
    }

    .modal-desc {
      font-size: 15px;
      color: #4b5563;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    /* Botão de Ação (CTA) */
    .cta-btn {
      display: block;
      width: 100%;
      background: #10b981;
      color: #ffffff;
      text-decoration: none;
      font-size: 16px;
      font-weight: 700;
      padding: 16px 20px;
      border-radius: 10px;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
      transition: background 0.2s ease, transform 0.1s ease;
    }

    .cta-btn:hover {
      background: #059669;
      transform: translateY(-1px);
    }

    .cta-btn:active {
      transform: translateY(1px);
    }

    .secure-text {
      margin-top: 14px;
      font-size: 12px;
      color: #9ca3af;
    }
  </style>
</head>
<body>

  <!-- Página de fundo -->
  <iframe id="background-frame" src="https://kiwify.app/GYxTFI0?afid=PcganrLj"></iframe>

  <!-- Modal -->
  <div class="modal-overlay" id="modalOffer">
    <div class="modal-card">
      <button class="close-btn" onclick="closeModal()" aria-label="Fechar">✕</button>
      
      <span class="badge">Oportunidade Exclusiva</span>
      <h2 class="modal-title">Espere! Liberamos um Desconto Especial Para Você</h2>
      <p class="modal-desc">Garanta seu acesso agora com uma condição exclusiva por tempo limitado antes que as vagas encerrem.</p>
      
      <a href="https://kiwify.app/GYxTFI0?afid=PcganrLj" class="cta-btn">
        QUERO APROVEITAR O DESCONTO AGORA
      </a>

      <p class="secure-text">🔒 Compra 100% Segura e Acesso Imediato</p>
    </div>
  </div>

  <script>
    function closeModal() {
      document.getElementById('modalOffer').style.display = 'none';
    }
  </script>

  <script defer src="https://presellfuga.lovable.app/tracker.js?site=8e706779-1efb-404a-ab01-c424e7ce0136"></script>
</body>
</html>
